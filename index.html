<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provisioned — Join the waitlist</title>
<meta name="description" content="Provisioned turns your pantry into a meal plan and your meal plan into a basket, automatically. Join the waitlist." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5ead8;
    --surface: #ebddc5;
    --accent: #c67139;
    --accent-2: #7a8a5e;
    --ink: #2c2417;
    --ink-soft: #6b5f4c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border-radius: 28px;
    padding: 48px 40px;
    text-align: center;
  }
  .mark { font-size: 32px; margin-bottom: 8px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  .field {
    width: 100%;
    padding: 14px 20px;
    border-radius: 999px;
    border: 1px solid rgba(44,36,23,0.15);
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    font-size: 15px;
    outline: none;
  }
  .field:focus { border-color: var(--accent); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .button {
    appearance: none;
    border: none;
    padding: 14px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: 'Karla', system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .error {
    display: none;
    color: #a4462a;
    background: rgba(198,113,57,0.12);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    margin: -8px 0 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🧺</div>
    <h1>Your week, already drafted.</h1>
    <p class="lede">Provisioned turns what's in your pantry into a meal plan, and your meal plan into a basket — automatically. Join the waitlist for early access.</p>
    <p class="error" id="error"></p>
    <form method="POST" action="https://guvlbxladwaokojhycmw.supabase.co/functions/v1/waitlist">
      <input class="field" type="text" name="name" placeholder="Your name (optional)" autocomplete="name" />
      <input class="field" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" />
      <button class="button" type="submit">Join the waitlist</button>
    </form>
  </div>
  <script>
    var messages = {
      invalid_email: "That doesn't look like a valid email address.",
      bad_request: "Something went wrong — please try again.",
      server: "Something went wrong — please try again."
    };
    var reason = new URLSearchParams(location.search).get('error');
    if (reason && messages[reason]) {
      var el = document.getElementById('error');
      el.textContent = messages[reason];
      el.style.display = 'block';
    }
  </script>
</body>
</html>
