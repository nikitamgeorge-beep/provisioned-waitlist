<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provisioned — You're on the list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5ead8;
    --surface: #ebddc5;
    --accent-2: #7a8a5e;
    --ink: #2c2417;
    --ink-soft: #6b5f4c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border-radius: 28px;
    padding: 48px 40px;
    text-align: center;
  }
  .mark { width: 40px; height: auto; margin-bottom: 12px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .button.ghost {
    display: inline-block;
    background: transparent;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    padding: 14px 20px;
    border-radius: 999px;
    font-family: 'Karla', system-ui, sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="./tiffin-mark.svg" alt="Provisioned" />
    <h1>You're on the list.</h1>
    <p class="lede">We'll email you the moment early access opens. In the meantime, thanks for wanting a week that arrives already provisioned.</p>
    <a class="button ghost" href="./">Back</a>
  </div>
</body>
</html>
